[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SITE_URL = "https://demo.accio.mx"

# Las demos no deben indexarse (ya hay robots.txt y noindex); esto evita cachés raros al republicar.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
